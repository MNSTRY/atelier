name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Denylist assertions run in the secret-sweep lane; this job acknowledges
      # a structural-only run explicitly. Never add this to secret-sweep.
      ATELIER_ALLOW_MISSING_DENYLIST: '1'
    steps:
      # fetch-depth: 0 because contract:compat resolves the baseline by TAG and
      # a depth-1 checkout fetches no tags. The gate fails closed on an
      # unresolvable ref, so a shallow checkout turns it red rather than
      # silently vacuous — but red for a reason unrelated to compatibility.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run syntax:check
      - run: npm test
      - run: npm run contract
      - run: npm run egress:check
      - run: npm run migrations:check
      - run: npm run contract:compat
  consumer-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      # npm ci warms the cache so the tarball's ajv deps resolve under --offline
      - run: npm ci
      - run: npm run consumer:smoke
  structural-sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: structural + commit-identity sweep (no secrets)
        # Repo values reach shell only via env vars ("$VAR"), never by ${{ }}
        # interpolation inside the run: block (expression injection if a
        # maintainer pastes a poisoned value into the variable).
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT_SCAN: ${{ vars.ATELIER_COMMIT_SCAN }}
        run: |
          case "$COMMIT_SCAN" in none|all) ;; *) COMMIT_SCAN=none ;; esac
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node scripts/check-repo-disclosure.mjs --structural-only --commits range --base "$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-repo-disclosure.mjs --structural-only --commits range --base "$PUSH_BEFORE"
          else
            node scripts/check-repo-disclosure.mjs --structural-only --commits "$COMMIT_SCAN"
          fi
  secret-sweep:
    runs-on: ubuntu-latest
    steps:
      # Explicit failure, never a job-level `if:` — GitHub treats a skipped job
      # as satisfying a required status check; failing is the only safe block.
      # The secret is scoped to individual steps so npm ci (and any dependency
      # lifecycle script) never sees it; install additionally ignores scripts.
      - name: refuse to pass without the denylist (fork PRs land here)
        env:
          ATELIER_DENYLIST_JSON: ${{ secrets.ATELIER_RELEASE_DENYLIST }}
        run: |
          if [ -z "$ATELIER_DENYLIST_JSON" ]; then
            echo "denylist secret unavailable (fork PR or missing secret) — a maintainer must dispatch fork-sweep on this SHA"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: repo-wide disclosure sweep
        # Repo values reach shell only via env vars ("$VAR"), never by ${{ }}
        # interpolation inside the run: block (expression injection).
        env:
          ATELIER_DENYLIST_JSON: ${{ secrets.ATELIER_RELEASE_DENYLIST }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          COMMIT_SCAN: ${{ vars.ATELIER_COMMIT_SCAN }}
        run: |
          case "$COMMIT_SCAN" in none|all) ;; *) COMMIT_SCAN=none ;; esac
          if [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            node scripts/check-repo-disclosure.mjs --commits range --base "$PUSH_BEFORE"
          else
            node scripts/check-repo-disclosure.mjs --commits "$COMMIT_SCAN"
          fi
      # The test job runs pack neutrality structural-only (it acknowledges the
      # missing denylist and the test visibly skips the denylist assertions);
      # this lane re-runs the same test with the real denylist so the name
      # assertions actually execute somewhere in CI.
      - name: pack neutrality with denylist
        env:
          ATELIER_DENYLIST_JSON: ${{ secrets.ATELIER_RELEASE_DENYLIST }}
        run: node --test test/readiness-protocols.test.mjs
      - name: release audit
        env:
          ATELIER_DENYLIST_JSON: ${{ secrets.ATELIER_RELEASE_DENYLIST }}
        run: npm run release:audit
